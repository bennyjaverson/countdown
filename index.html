<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown</h1>
        <div class="timer">
            <div>
                <span id="hours">00</span><p>Jam</p>
            </div>
            <div>
                <span id="mins">00</span><p>Menit</p>
            </div>
            <div>
                <span id="secs">00</span><p>Detik</p>
            </div>
        </div>
        <div class="buttons">
            <button id="btnStart">Mulai</button>
            <button id="btnReset">Reset</button>
        </div>
        <footer>
            <p>Benny Javerson D A (252410103106)</p>
        </footer>
    </div>  
    <script src="script.js"></script>
</body>
</html>
